{% extends "layout/basic.html" %}

{% block title %}Добавление изображения{% endblock %}

{% block content %}
    <h2>Добавление изображения</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Добавить</button>
    </form>

    {% for img in imgs %}
        <div><img src="{{ img.img.url }}"></div>
        <p>{{ img.img.desc }}</p>
    {% endfor %}

{% endblock %}
