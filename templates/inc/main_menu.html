<nav>
    <a href="{% url 'bboard:index' %}">Главная</a>
    <a href="{% url 'bboard:add' %}">Добавить</a>

    <a href="{% url 'admin:index' %}">Админка</a>

    {% if user.is_authenticated %}
        <form action="{% url 'bboard:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">Выйти</button>
        </form>
    {% else %}
        <a href="{% url 'bboard:login' %}">Войти</a>
    {% endif %}

    {% for rubric in rubrics %}
        <a href="{% url 'bboard:by_rubric' rubric.pk %}">
            {{ rubric.name }} ({{ rubric.cnt }})</a>
    {% endfor %}
</nav>
